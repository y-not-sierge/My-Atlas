<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4cc38a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  #app { display: flex; height: 100vh; }

  #panel {
    width: 320px; min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #panel header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  #panel header h1 { font-size: 1.25rem; letter-spacing: 0.5px; }
  #panel header p { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  #toolbar {
    display: flex; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  #toolbar button, .btn {
    flex: 1; padding: 8px; font-size: 0.8rem; cursor: pointer;
    background: #21262d; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
  }
  #toolbar button:hover, .btn:hover { background: #2d333b; border-color: var(--muted); }
  #places {
    flex: 1; overflow-y: auto; list-style: none; padding: 8px;
  }
  #places li {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  #places li:hover { background: #21262d; }
  #places .meta { color: var(--muted); font-size: 0.72rem; margin-top: 2px; }
  #places .del {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 1rem; padding: 2px 6px;
  }
  #places .del:hover { color: #f85149; }
  #empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 24px 12px; }

  #map { flex: 1; background: #010409; }

  .popup-form { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
  .popup-form input, .popup-form textarea {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 0.85rem;
  }
  .popup-form button {
    background: var(--accent); color: #0d1117; font-weight: 600;
    border: none; border-radius: 6px; padding: 7px; cursor: pointer;
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel) !important; color: var(--text) !important;
  }
  .leaflet-bar a { background: var(--panel) !important; color: var(--text) !important; border-bottom: 1px solid var(--border) !important; }

  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #panel { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--border); }
    #map { height: 60%; }
  }
</style>
<base target="_blank">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>🌍 My Atlas</h1>
      <p>Click anywhere on the map to pin a place.</p>
    </header>
    <div id="toolbar">
      <button id="exportBtn">Export</button>
      <button id="importBtn">Import</button>
      <button id="clearBtn">Clear all</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
    <ul id="places"></ul>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORAGE_KEY = "myAtlas.places.v1";

const map = L.map("map").setView([25, 10], 2);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 18
}).addTo(map);

let places = [];
try { places = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { places = []; }

const markers = new Map(); // id -> L.marker

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(places));
}

function addMarker(place) {
  const m = L.marker([place.lat, place.lng]).addTo(map);
  m.bindPopup(() => {
    const div = document.createElement("div");
    div.innerHTML = `<strong></strong><p style="margin:4px 0"></p>`;
    div.querySelector("strong").textContent = place.name;
    div.querySelector("p").textContent = place.note || "";
    const del = document.createElement("button");
    del.className = "btn"; del.textContent = "Delete pin";
    del.onclick = () => removePlace(place.id);
    div.appendChild(del);
    return div;
  });
  markers.set(place.id, m);
}

function removePlace(id) {
  places = places.filter(p => p.id !== id);
  const m = markers.get(id);
  if (m) { map.removeLayer(m); markers.delete(id); }
  save(); renderList(); map.closePopup();
}

function renderList() {
  const ul = document.getElementById("places");
  ul.innerHTML = "";
  if (!places.length) {
    ul.innerHTML = `<li id="empty">No places yet — click the map to add your first pin! 📍</li>`;
    return;
  }
  places.forEach(p => {
    const li = document.createElement("li");
    const info = document.createElement("div");
    const name = document.createElement("div"); name.textContent = p.name;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = `${p.lat.toFixed(2)}, ${p.lng.toFixed(2)}` + (p.note ? " · " + p.note : "");
    info.append(name, meta);
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "Delete";
    del.onclick = (e) => { e.stopPropagation(); removePlace(p.id); };
    li.append(info, del);
    li.onclick = () => map.flyTo([p.lat, p.lng], 6, { duration: 1.2 });
    ul.appendChild(li);
  });
}

map.on("click", (e) => {
  const form = document.createElement("div");
  form.className = "popup-form";
  const nameInput = document.createElement("input");
  nameInput.placeholder = "Place name";
  const noteInput = document.createElement("textarea");
  noteInput.placeholder = "Note (optional)"; noteInput.rows = 2;
  const btn = document.createElement("button");
  btn.textContent = "Save pin";
  form.append(nameInput, noteInput, btn);

  const popup = L.popup({ closeOnClick: false, autoClose: false })
    .setLatLng(e.latlng)
    .setContent(form)
    .openOn(map);
  nameInput.focus();

  btn.onclick = () => {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    const place = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name,
      note: noteInput.value.trim(),
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };
    places.push(place);
    addMarker(place);
    save(); renderList();
    map.closePopup();
  };
});

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(places, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "my-atlas.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error("bad file");
      places.forEach(p => { const m = markers.get(p.id); if (m) map.removeLayer(m); });
      markers.clear();
      places = data;
      places.forEach(addMarker);
      save(); renderList();
    } catch (err) { alert("That file doesn't look like a My Atlas export."); }
  };
  reader.readAsText(file);
  e.target.value = "";
};

document.getElementById("clearBtn").onclick = () => {
  if (!places.length) return;
  if (!confirm(`Delete all ${places.length} pinned places?`)) return;
  markers.forEach(m => map.removeLayer(m));
  markers.clear(); places = [];
  save(); renderList();
};

places.forEach(addMarker);
renderList();
</script>
</body>
</html>
